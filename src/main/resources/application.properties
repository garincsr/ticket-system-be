spring.application.name=ticket-system

#Database Configuration
server.port=8089
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ticket_system_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres123}
spring.jackson.time-zone=Asia/Jakarta

#jwt
app.ticket-system.jwt.jwt-secret=${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9}
app.ticket-system.jwt.app-name=ticket-system
app.ticket-system.jwt.expired=${JWT_EXPIRED:3600}

#seed super admin
app.seed.super-admin.username=${SEED_ADMIN_USERNAME:superadmin}
app.seed.super-admin.password=${SEED_ADMIN_PASSWORD:superadmin123}